<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hotelbeds — Cancelar reserva (Apitude)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.25rem; }
    label { display: block; margin-top: 0.75rem; font-weight: 600; font-size: 0.9rem; }
    input, select, button { width: 100%; padding: 0.55rem 0.65rem; margin-top: 0.25rem; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 1rem; background: #1a6e3c; color: #fff; border: 0; cursor: pointer; font-weight: 600; }
    button.secondary { background: #555; }
    .hint { font-size: 0.85rem; color: #555; margin-top: 0.35rem; }
    pre { background: #f4f4f4; padding: 0.75rem; overflow: auto; font-size: 0.8rem; border-radius: 6px; }
    .warn { background: #fff8e6; border: 1px solid #e6c200; padding: 0.65rem 0.75rem; border-radius: 6px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Cancelación Hotelbeds (Apitude)</h1>
  <p class="warn">Uso interno / certificación. Primero <strong>SIMULATION</strong> (ver gastos), luego <strong>CANCELLATION</strong> si procede. Requiere <code>HOTELBEDS_LOGS_SECRET</code> en Vercel.</p>

  <label for="ref">Referencia reserva (ej. 102-20934799)</label>
  <input id="ref" type="text" autocomplete="off" placeholder="102-…" />

  <label for="flag">cancellationFlag</label>
  <select id="flag">
    <option value="SIMULATION">SIMULATION (solo consulta gastos)</option>
    <option value="CANCELLATION">CANCELLATION (cancela de verdad)</option>
  </select>

  <label for="secret">Secret (HOTELBEDS_LOGS_SECRET)</label>
  <input id="secret" type="password" autocomplete="off" />

  <button type="button" id="btn">Ejecutar</button>
  <p class="hint">DELETE /hotel-api/1.0/bookings/{ref}?cancellationFlag=… vía <code>/api/hotelbeds-availability</code></p>

  <h2>Respuesta</h2>
  <pre id="out">—</pre>

  <script>
    document.getElementById('btn').addEventListener('click', async function () {
      var out = document.getElementById('out');
      out.textContent = '…';
      var body = {
        action: 'cancel',
        reference: document.getElementById('ref').value.trim(),
        cancellationFlag: document.getElementById('flag').value,
        secret: document.getElementById('secret').value,
      };
      try {
        var res = await fetch('/api/hotelbeds-availability', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        var data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = String(e && e.message ? e.message : e);
      }
    });
  </script>
</body>
</html>
