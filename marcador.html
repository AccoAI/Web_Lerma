<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marcador en vivo · Golf Lerma y Saldaña</title>
  <style>
    :root {
      --green: #1b5e3a;
      --green-dark: #0e3d25;
      --cream: #f6f3ea;
      --ink: #161c17;
      --muted: #45504a;
      --card: #fffdf7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
    }
    header {
      background: var(--green-dark);
      color: #fff;
      padding: 18px 16px 16px;
    }
    header p { margin: 4px 0 0; opacity: 0.85; font-size: 14px; }
    main { padding: 16px; max-width: 560px; margin: 0 auto; }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 1px 3px rgba(14, 61, 37, 0.08);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pos {
      font-size: 22px;
      font-weight: 700;
      color: var(--green);
      width: 28px;
    }
    .name { font-weight: 650; }
    .thru { font-size: 13px; color: var(--muted); }
    .score { margin-left: auto; font-weight: 700; color: var(--green); font-size: 18px; }
    .empty, .err {
      background: var(--card);
      border-radius: 16px;
      padding: 24px 18px;
      text-align: center;
      color: var(--muted);
    }
    .code {
      letter-spacing: 0.18em;
      font-weight: 700;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <div class="code" id="codeLabel"></div>
    <h1 id="title" style="margin:8px 0 0;font-size:22px;">Marcador en vivo</h1>
    <p id="subtitle">Se actualiza solo, hoyo a hoyo. No hace falta tener la app.</p>
  </header>
  <main id="board">
    <div class="empty">Cargando marcador…</div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const code = (params.get('c') || params.get('code') || '').trim().toUpperCase();
    document.getElementById('codeLabel').textContent = code || 'SIN CODIGO';

    async function load() {
      const board = document.getElementById('board');
      if (!code) {
        board.innerHTML = '<div class="err">Falta el codigo de la partida en el enlace.</div>';
        return;
      }
      try {
        const res = await fetch('/api/marcador?code=' + encodeURIComponent(code));
        if (res.status === 404) {
          board.innerHTML = '<div class="empty">Todavia no hay golpes publicados con este codigo. En cuanto apunten un hoyo, saldra aqui.</div>';
          return;
        }
        if (!res.ok) throw new Error('http');
        const data = await res.json();
        document.getElementById('title').textContent = data.courseName || 'Marcador en vivo';
        document.getElementById('subtitle').textContent =
          (data.formatLabel || '') + ' · hoyo ' + (data.currentHole || '-') +
          ' · ' + (data.holesCompleted || 0) + ' de ' + (data.holeCount || 18);
        if (!data.players || !data.players.length) {
          board.innerHTML = '<div class="empty">Partida abierta. Esperando el primer hoyo.</div>';
          return;
        }
        board.innerHTML = data.players.map(function (row, i) {
          return '<div class="card">' +
            '<div class="pos">' + (i + 1) + '</div>' +
            '<div><div class="name">' + escapeHtml(row.name) + '</div>' +
            '<div class="thru">' + (row.thru || 0) + ' hoyos' +
            (row.toPar ? ' · ' + row.toPar : '') + '</div></div>' +
            '<div class="score">' + escapeHtml(row.score || '') + '</div></div>';
        }).join('');
      } catch (e) {
        board.innerHTML = '<div class="err">No se ha podido cargar el marcador. Reintenta en unos segundos.</div>';
      }
    }

    function escapeHtml(text) {
      return String(text || '').replace(/[&<>"']/g, function (ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }

    load();
    setInterval(load, 4000);
  </script>
</body>
</html>
